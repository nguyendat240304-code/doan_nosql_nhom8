<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS - Quản lý Sinh viên</title>
  <link href="/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/lib/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
  <main id="page-main-content">
    <div id="alertBox"></div>
        
        <div id="sinhvien-list">
            <div class="page-header">
              <div><h4 class="mb-0">Quản lý sinh viên</h4><small class="text-muted">Danh sách và hồ sơ sinh viên</small></div>
            </div>
            <div class="table-toolbar">
              <input id="filterQ" class="form-control" type="search" placeholder="Tìm MSSV hoặc họ tên..." oninput="debouncedFilterSinhVien()" />
              <select id="filterLop" class="form-select" onchange="renderSinhVienTable()">
                <option value="">Tất cả lớp</option>
              </select>
              <button class="btn btn-primary text-nowrap" data-bs-toggle="modal" data-bs-target="#modalSinhVien" onclick="openCreateSv()">
                <i class="bi bi-plus-lg me-1"></i> Thêm sinh viên
              </button>
              <div id="svCount" class="table-result-count" aria-live="polite">Đang tải danh sách...</div>
            </div>
            <div class="table-scroll-card">
            <div class="table-responsive table-scroll-area">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>MSSV</th><th>Họ tên</th><th>Lớp</th><th>Khoa</th><th>Trạng thái</th><th class="text-end">Thao tác</th>
                  </tr>
                </thead>
                <tbody id="svTable"></tbody>
              </table>
            </div>
            <div id="svPagination" class="table-pagination"></div>
            </div>
        </div>

        <div id="svDetail" style="display: none;">
          <button class="btn btn-outline-secondary btn-sm mb-3" onclick="showPage('list')">
            <i class="bi bi-arrow-left me-1"></i> Quay lại danh sách
          </button>
        </div>

  </main>

  <div class="modal fade" id="modalSinhVien" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <form class="modal-content" onsubmit="saveSinhVien(event)" novalidate>
        <div class="modal-header"><h5 class="modal-title" id="svModalTitle">Thêm sinh viên</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body">
          <input type="hidden" id="svIsEdit" />
          <div id="modalSinhVien-error" class="alert alert-danger py-2 mb-2" style="display:none;"></div>
          <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">MSSV <span class="text-danger">*</span></label>
            <input id="svId" class="form-control" required placeholder="VD: SV2026101" />
            <div class="invalid-feedback">Vui lòng nhập MSSV hợp lệ.</div>
          </div>
          <div class="col-md-6"><label class="form-label">Họ tên <span class="text-danger">*</span></label><input id="svHoTen" class="form-control" required /><div class="invalid-feedback">Vui lòng nhập họ tên.</div></div>
          <div class="col-md-6"><label class="form-label">Giới tính</label>
            <select id="svGioiTinh" class="form-select"><option>Nam</option><option>Nữ</option></select>
          </div>
          <div class="col-md-6"><label class="form-label">Email</label><input id="svEmail" type="email" class="form-control" /><div class="invalid-feedback">Email chưa đúng định dạng.</div></div>
          <div class="col-md-6"><label class="form-label">Điện thoại</label><input id="svDienThoai" class="form-control" /></div>
          <div class="col-md-6"><label class="form-label">Lớp sinh hoạt</label><input id="svLop" class="form-control" value="14DHTH01" /></div>
          <div class="col-md-6"><label class="form-label">Khoa</label><select id="svMaKhoa" class="form-select"></select></div>
          <div class="col-md-6"><label class="form-label">Khóa học</label><input id="svKhoaHoc" class="form-control" value="K14" /></div>
          <div class="col-12"><div class="border rounded p-2" id="svCreateAccountDiv" style="display:none;">
            <div class="form-check">
              <input id="svTaoTaiKhoan" class="form-check-input" type="checkbox" onchange="toggleCreateStudentAccount()" />
              <label class="form-check-label" for="svTaoTaiKhoan">Tạo tài khoản đăng nhập cho sinh viên</label>
            </div>
            <div class="mt-2">
              <label class="form-label small mb-1">Mật khẩu (tối thiểu 6 ký tự)</label>
              <input id="svMatKhauTaiKhoan" type="password" class="form-control form-control-sm" minlength="6" disabled />
              <small class="text-muted">Tên đăng nhập sẽ là MSSV.</small>
            </div>
          </div></div>
          <div class="col-md-6" id="svTrangThaiDiv" style="display:none;"><label class="form-label">Trạng thái</label>
            <select id="svTrangThai" class="form-select"><option>Đang học</option><option>Đã nghỉ</option></select>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js?v=20261017-eye-toggle"></script>
  <script src="/js/app.js"></script>
  <script>
    renderLayout('sinhvien');
    fillLopSelects();
    loadSinhVien();
  </script>
</body>
</html>
