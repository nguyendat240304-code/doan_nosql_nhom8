<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS HUIT - Tổng quan</title>
  <link href="/lib/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/lib/bootstrap-icons/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/css/app.css" rel="stylesheet" />
</head>
<body>
<main id="page-main-content">
  <div id="alertBox"></div>

  <!-- Hero -->
  <div class="hero p-4 mb-4 no-print">
    <div class="row align-items-center">
      <div class="col">
        <h3 class="mb-1 fw-bold">Cổng học tập trực tuyến</h3>
        <p class="mb-0 opacity-75 small">Quản lý học tập và kết quả học phần</p>
      </div>
      <div class="col-auto d-none d-md-block">
        <i class="bi bi-mortarboard-fill" style="font-size:3.5rem;opacity:.2;"></i>
      </div>
    </div>
  </div>

  <!-- Stat cards -->
  <div class="row g-3 mb-4" id="statCards"></div>

  <!-- Quick actions (admin/gv only) -->
  <div id="quickActionsSection" style="display:none;">
    <div class="d-flex align-items-center mb-3 mt-2">
      <span class="fw-bold text-secondary small text-uppercase" style="letter-spacing:.8px;">Truy cập nhanh</span>
    </div>
    <div class="row g-3" id="quickActions"></div>
  </div>

</main>

<script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout.js?v=20261017-eye-toggle"></script>
<script src="/js/app.js"></script>
<script>
  renderLayout('dashboard');

  const role = localStorage.getItem('role');

  // Quick actions cho admin/gv
  if (role === 'admin' || role === 'giaovien') {
    document.getElementById('quickActionsSection').style.display = '';
    const actions = role === 'admin' ? [
      { href: '/sinhvien.html',   icon: 'bi-people-fill',        label: 'Quản lý Sinh viên',    color: 'text-primary' },
      { href: '/diem.html',       icon: 'bi-pencil-square',      label: 'Chấm điểm',            color: 'text-success' },
      { href: '/lophocphan.html', icon: 'bi-journal-bookmark',   label: 'Lớp học phần',         color: 'text-warning' },
      { href: '/baocao.html',     icon: 'bi-graph-up-arrow',     label: 'Báo cáo học lực',      color: 'text-info' },
      { href: '/taikhoan.html',   icon: 'bi-person-badge-fill',  label: 'Tài khoản',            color: 'text-danger' },
      { href: '/importexport.html',icon: 'bi-arrow-left-right',  label: 'Import / Export',      color: 'text-secondary' },
    ] : [
      { href: '/diem.html',       icon: 'bi-pencil-square',      label: 'Chấm điểm',            color: 'text-success' },
      { href: '/baocao.html',     icon: 'bi-graph-up-arrow',     label: 'Báo cáo học lực',      color: 'text-info' },
    ];
    document.getElementById('quickActions').innerHTML = actions.map(a => `
      <div class="col-6 col-md-3 col-lg-2">
        <a href="${a.href}" class="quick-action">
          <i class="bi ${a.icon} ${a.color}"></i>
          <div class="small fw-semibold">${a.label}</div>
        </a>
      </div>`).join('');
  }

  loadDashboard();
</script>
</body>
</html>
